name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Verify deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "Required production deployment secret is missing: $name" >&2
              exit 1
            fi
          done

      - name: Verify migration manifest
        run: npm ci --no-audit --no-fund && npm run check:migrations

      - name: Apply database migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked
          supabase migration list --linked

      - name: Deploy Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          for function_dir in supabase/functions/*; do
            if [[ -f "$function_dir/index.ts" ]]; then
              supabase functions deploy "$(basename "$function_dir")" --project-ref "$SUPABASE_PROJECT_REF"
            fi
          done

      - name: Build and deploy frontend
        run: |
          npm exec --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npm exec --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npm exec --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
